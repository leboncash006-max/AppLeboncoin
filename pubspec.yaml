name: mpb_check
description: "Analyse une annonce Leboncoin et estime la reprise MPB."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  webview_flutter: ^4.8.0
  receive_sharing_intent: ^1.9.0
  google_fonts: ^8.2.1
  flutter_markdown_plus: ^1.0.12
  path_provider: ^2.1.5
  sqflite: ^2.4.4
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

# Icône de l'appli (générée dans le workflow après « flutter create »)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon_square.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
