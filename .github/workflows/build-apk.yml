name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Génère le dossier android/ s'il n'existe pas encore (les fichiers existants ne sont pas écrasés)
      - name: Créer le projet Android
        run: |
          if [ ! -d android ]; then
            flutter create --org fr.eddybonnet --project-name mpb_check --platforms android .
          fi

      - name: Permission Internet et nom de l'appli
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $M || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i 's#android:label="[^"]*"#android:label="MPB Check"#' $M
          cat $M

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: mpb-check-apk
          path: build/app/outputs/flutter-apk/app-release.apk
