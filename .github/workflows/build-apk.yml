name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Génère le dossier android/ s'il n'existe pas encore (les fichiers existants ne sont pas écrasés)
      - name: Créer le projet Android
        run: |
          if [ ! -d android ]; then
            flutter create --org fr.eddybonnet --project-name mpb_check --platforms android .
          fi

      # INTERNET, nom « MPB Check », partage Android (ACTION_SEND text/plain), singleTask
      - name: Compléter le manifeste Android
        run: python3 tool/patch_manifest.py android/app/src/main/AndroidManifest.xml

      # receive_sharing_intent 1.9 est compilé contre l'API 37 : l'appli doit l'être aussi
      # (minSdk et targetSdk restent ceux de Flutter)
      - name: compileSdk 37
        run: |
          G=android/app/build.gradle.kts
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 37/' $G
          grep -q 'compileSdk = 37' $G
          grep -q 'suppressUnsupportedCompileSdk' android/gradle.properties || \
            echo 'android.suppressUnsupportedCompileSdk=37' >> android/gradle.properties

      - run: flutter pub get

      - name: Icône de l'appli
        run: dart run flutter_launcher_icons

      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: mpb-check-apk
          path: build/app/outputs/flutter-apk/app-release.apk
